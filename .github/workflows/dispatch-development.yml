name: Request development deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Customer web CI"]
    types: [completed]

permissions: {}

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'develop' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create API workflow dispatch token
        id: dispatch-app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DEV_DISPATCH_APP_ID }}
          private-key: ${{ secrets.DEV_DISPATCH_APP_PRIVATE_KEY }}
          owner: codeidea-korea
          repositories: comviewers_api
          permission-actions: write
      - name: Verify dispatch app access without deploying
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TOKEN: ${{ steps.dispatch-app.outputs.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          token = os.environ.get('TOKEN','')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+',token): sys.exit('::error::Invalid dispatch token')
          url='https://api.github.com/repos/codeidea-korea/comviewers_api/actions/workflows/auto-development.yml'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28','User-Agent':'comviewers-dispatch-probe'})
          try:
              with urllib.request.urlopen(request,timeout=20) as response:
                  if response.status != 200: raise ValueError('unexpected response')
              probe=urllib.request.Request(url+'/dispatches',data=json.dumps({'ref':'main','inputs':{'mode':'probe'}}).encode(),
                  method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28','User-Agent':'comviewers-dispatch-probe'})
              with urllib.request.urlopen(probe,timeout=20) as response:
                  if response.status != 204: raise ValueError('unexpected dispatch response')
              print('Dispatch app access verified; no deployment requested')
          except (urllib.error.URLError,ValueError):
              sys.exit('::error::Dispatch app access failed')
          PY
      - name: Request exact develop commit
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          TOKEN: ${{ steps.dispatch-app.outputs.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          token = os.environ.get('TOKEN',''); target = os.environ.get('TARGET_SHA','')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+', token) or not re.fullmatch(r'[0-9a-f]{40}', target):
              sys.exit('::error::Invalid dispatch inputs')
          url = 'https://api.github.com/repos/codeidea-korea/comviewers_api/actions/workflows/auto-development.yml/dispatches'
          payload = {'ref':'main','inputs':{'mode':'single','component':'user','single_sha':target}}
          request = urllib.request.Request(url, data=json.dumps(payload).encode(), method='POST',
              headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                       'X-GitHub-Api-Version':'2022-11-28','User-Agent':'comviewers-development-dispatch'})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 204: raise ValueError('unexpected response')
              print('Development deployment request sent')
          except (urllib.error.URLError, ValueError):
              sys.exit('::error::Could not request development deployment')
          PY
