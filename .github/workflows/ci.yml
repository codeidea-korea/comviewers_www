name: Customer web CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # The customer translation iframe URL is configured per deployment server.
        # CI does not supply that server-specific value.
        env:
          VITE_API_BASE_URL: '/'
          VITE_ENABLE_PUBLISHING_PREVIEWS: 'false'
        run: npm run build

      - name: Preserve development customer web candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-customer-web-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
